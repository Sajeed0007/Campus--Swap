name: CI

# Runs on every push and PR. This is the first environment in which this project
# actually compiles: local development has no Maven/npm toolchain available.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to 21 to match <java.version> in pom.xml. Do not raise this above
      # the version Spring Boot 3.2.1 supports; newer JDKs break the Lombok
      # release that Spring Boot 3.2.1 manages.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Show toolchain
        run: java -version && mvn -v

      # Integration tests run against H2 via the "test" profile and read the
      # development jwt.secret default from application.yml, so no secrets are
      # needed for this job.
      - name: Build and test
        run: mvn -B -ntp verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: warn

      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: target/*.jar
          if-no-files-found: error

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest

    # Applies to `run` steps only. It does NOT affect `cache-dependency-path` or
    # `upload-artifact` paths, which are always resolved from the repo root.
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          # Repo-root-relative on purpose. If this glob matches nothing the action
          # fails with "Some specified paths were not resolved, unable to cache
          # dependencies", so frontend/package-lock.json must be committed.
          cache-dependency-path: frontend/package-lock.json

      # Requires a committed lockfile and installs exactly the pinned versions.
      # Failing here on a missing or out-of-sync lockfile is intended: it keeps CI
      # builds reproducible instead of silently resolving new versions.
      - name: Install dependencies
        run: npm ci

      # Dedicated typecheck so a type error is reported before bundling starts.
      # `npm run build` also runs tsc, but this gives a faster, clearer signal.
      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Upload dist
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
